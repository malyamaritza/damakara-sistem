<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Manager - Batik ABC</title>
    <link rel="stylesheet" href="manager-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="logo-area">
            <img src="../gambar/logo2.png" alt="Dama Kara Logo" class="login-logo-img">
            <h2 style="margin-top: 10px;">Manager Access</h2>
            <p class="text-muted" style="font-size: 0.9rem;">Kepala Store / Supervisor</p>
        </div>
        <form id="loginForm">
            <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                <label>Username / ID Karyawan</label>
                <input type="text" id="usernameInput" placeholder="Contoh: Budi01" class="input-field" required>
            </div>
            <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                <label>Password Akses</label>
                <input type="password" id="passwordInput" placeholder="******" required class="input-field">
            </div>
            <button type="submit" class="btn-primary full-width" style="margin-top: 20px; padding: 15px;">Masuk Dashboard</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Validasi dummy
            window.location.href = 'manager-app.html';
        });
    </script>
</body>
</html>
