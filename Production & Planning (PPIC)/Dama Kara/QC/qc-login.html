<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Inbound - Batik GoCamp</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        /* --- STYLE KHUSUS LOGIN --- */
        body {
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            background: linear-gradient(135deg, #ca6924 0%, #ca6924 100%); /* Warna Orange Utama */
            overflow: hidden;
        }

        .login-container {
            background: #ffffff; 
            padding: 10px 3rem 3rem 3rem;
            border-radius: 16px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%; 
            max-width: 400px; 
            text-align: center;
        }

        .logo-area { margin-bottom: 20px; }
        .login-logo-img { display: block; max-width: 220px; height: auto; margin: -20px auto -25px; }
        .logo-area h2 { color: #2c3e50; font-weight: 700; margin-bottom: 5px; }
        .text-muted { color: #7f8c8d; font-size: 0.9rem; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: #555; }
        
        .form-control { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            outline: none; 
            font-size: 14px;
        }
        .form-control:focus { border-color: #CF5306; }

        .btn-primary { 
            background: #CF5306; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%;
            margin-top: 20px;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-primary:hover { background: #a84305; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <img src="../gambar/logo2.png" alt="Logo" class="login-logo-img">
            <h2 style="margin-top: 10px;">Inbound Portal</h2>
            <p class="text-muted">Penerimaan & Quality Control</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username / NIK</label>
                <input type="text" id="usernameInput" placeholder="staff_qc" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="******" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary">Masuk Portal</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'qc.html';
        });
    </script>
</body>
</html>
