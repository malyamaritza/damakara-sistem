<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Gudang - Batik ABC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="logo-area">
            <img src="../gambar/logo2.png" alt="Dama Kara Logo" class="login-logo-img">
            <h2 style="margin-top: 10px;">Warehouse Portal</h2>
            <p class="text-muted" style="font-size: 0.9rem;">Kepala Gudang & Logistik</p>
        </div>
        <form id="loginForm">
            <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                <label>Email / NIK</label>
                <input type="text" value="gudang_admin" class="input-modern" required>
            </div>
            <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                <label>Password</label>
                <input type="password" placeholder="******" class="input-modern" required>
            </div>
            <button type="button" onclick="handleLogin()" class="btn-primary full-width" style="margin-top: 20px; padding: 15px;">Masuk Sistem</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
