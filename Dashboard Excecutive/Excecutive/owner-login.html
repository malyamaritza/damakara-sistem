<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Login - Dama Kara</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="owner-style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="logo-area">
            <img src="../gambar/logo2.png" alt="Dama Kara Logo" class="login-logo-img" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block'">
            <h2 id="alt-logo" style="display:none; color:#CF5306;">DAMA KARA</h2>
            
            <h2 style="margin-top: 10px;">Executive Portal</h2>
            <p class="text-muted" style="font-size: 0.9rem;">Owner & Top Management View</p>
        </div>
        <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='owner.html';">
            <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                <label>Access ID</label>
                <input type="text" placeholder="owner_access" class="input-modern" required>
            </div>
            <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                <label>Secure PIN</label>
                <input type="password" placeholder="******" class="input-modern" required>
            </div>
            <button type="submit" class="btn-primary full-width" style="margin-top: 20px; padding: 15px;">Access Dashboard</button>
        </form>
    </div>
</body>
</html>
